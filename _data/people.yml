# ---------------------------------------------------------------------------
# Lab members. This single file drives BOTH the homepage team section
# (current members only) and the full People page at /people/ (everyone).
#
# To move someone to alumni: cut their entry out of `current:` and paste it
# under `alumni:`, then fill in `now:` (where they are now) and `years:`.
#
# Fields
#   name   (required) display name
#   role   (required) role in the lab. For alumni, the role they held here.
#   url    (optional) personal site / Scholar / LinkedIn
#   photo  (optional) e.g. /resources/people/profile_pics/tal_clear.png
#                     leave it out and initials are shown instead
#   pub_name (optional) the name they publish under, when it differs from the
#                     name shown here - used to bold them in author lists
#   years  (alumni)   e.g. "2023 - 2026"
#   now    (alumni)   where they are now, e.g. "Research Scientist, Allen AI"
#   now_url (alumni, optional) link for the `now` text
# ---------------------------------------------------------------------------

