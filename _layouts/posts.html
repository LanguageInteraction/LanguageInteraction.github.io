<link rel="stylesheet" href="/styles/blog-post.css">

<div class="blog-post-page">
  <a href="/blog/" class="blog-back-link">← Back to Blog</a>
  
  <header class="blog-post-header">
    <h1 class="blog-post-page-title">{{ page.title }}</h1>
    <div class="blog-post-meta">
      {% if page.author %}
        <span class="blog-post-author">By {{ page.author }}</span>
        <span class="meta-separator">•</span>
      {% endif %}
      <time class="blog-post-page-date">{{ page.date | date: "%B %-d, %Y" }}</time>
    </div>
  </header>
  
  <article class="blog-post-content">
    {{ content }}
  </article>

  <div class="giscus-comments">
    <script src="https://giscus.app/client.js"
            data-repo="LanguageInteraction/LanguageInteraction.github.io"
            data-repo-id="R_kgDOPzHAog"
            data-category="Announcements"
            data-category-id="DIC_kwDOPzHAos4C_cdO"
            data-mapping="pathname"
            data-strict="1"
            data-reactions-enabled="1"
            data-emit-metadata="0"
            data-input-position="top"
            data-theme="light"
            data-lang="en"
            data-loading="lazy"
            crossorigin="anonymous"
            async>
    </script>
  </div>
</div>

<nav class="toc-float" id="blog-toc" aria-label="Table of contents"></nav>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const article = document.querySelector('.blog-post-content');
  const toc     = document.getElementById('blog-toc');
  if (!article || !toc) return;

  const headings = Array.from(article.querySelectorAll('h2, h3'));
  if (headings.length < 2) return;

  const label = document.createElement('p');
  label.className = 'toc-label';
  label.textContent = 'Contents';
  toc.appendChild(label);

  let active = null;
  function setActive(link) {
    if (active) active.classList.remove('active');
    active = link;
    if (link) link.classList.add('active');
  }

  const ul = document.createElement('ul');
  headings.forEach((h, i) => {
    if (!h.id) h.id = 'toc-' + i;
    const li = document.createElement('li');
    li.className = 'toc-item toc-' + h.tagName.toLowerCase();
    const a = document.createElement('a');
    a.href = '#' + h.id;
    a.className = 'toc-link';
    a.textContent = h.textContent.replace(/^[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]+\s*/u, '');

    // Smooth scroll + immediate active on click
    a.addEventListener('click', e => {
      e.preventDefault();
      setActive(a);
      const top = h.getBoundingClientRect().top + window.scrollY - 90;
      window.scrollTo({ top, behavior: 'smooth' });
    });

    li.appendChild(a);
    ul.appendChild(li);
  });
  toc.appendChild(ul);

  toc.classList.add('toc-ready');

  // Scroll spy keeps active in sync while reading
  let clicking = false;
  const io = new IntersectionObserver(entries => {
    if (clicking) return;
    entries.forEach(e => {
      if (!e.isIntersecting) return;
      const link = toc.querySelector(`a[href="#${e.target.id}"]`);
      if (link) setActive(link);
    });
  }, { rootMargin: '-10% 0px -80% 0px' });

  headings.forEach(h => io.observe(h));

  // Suppress observer briefly after a click so it doesn't override the active
  toc.addEventListener('click', () => {
    clicking = true;
    setTimeout(() => { clicking = false; }, 800);
  });
});
</script>
